<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .header-title { fill: #000000; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .stereo { fill: #333333; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; font-style: italic; }
      .divider { stroke: #000000; stroke-width: 1; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 12px; fill: #000000; }
      .rel-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .dep-line { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .label-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; }
      .label-text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; }
      .multiplicity { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #000000; }
    </style>

    <!-- Arrow Markers (Black & White) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5" />
    </marker>
    <marker id="diamond-hollow" viewBox="0 0 16 16" refX="0" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <polygon points="0,8 8,2 16,8 8,14" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    </marker>
    <marker id="diamond-filled" viewBox="0 0 16 16" refX="0" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <polygon points="0,8 8,2 16,8 8,14" fill="#000000" stroke="#000000" stroke-width="1.5" />
    </marker>
  </defs>

  <rect width="1020" height="1280" class="bg" />

  <!-- ================= 1. CLUB (Top Center) ================= -->
  <g transform="translate(360, 40)">
    <rect width="300" height="230" class="box" />
    <text x="150" y="24" class="header-title">Club</text>
    <line x1="0" y1="36" x2="300" y2="36" class="divider" />

    <!-- Attributes -->
    <g transform="translate(14, 56)" class="code">
      <text y="0">+ Id : Guid</text>
      <text y="18">+ Name : string</text>
      <text y="36">+ Description : string</text>
      <text y="54">+ CreatedAt : DateTime</text>
      <text y="72">+ Members : IReadOnlyList&lt;Member&gt;</text>
    </g>
    <line x1="0" y1="145" x2="300" y2="145" class="divider" />

    <!-- Methods -->
    <g transform="translate(14, 166)" class="code">
      <text y="0">+ Create(name, desc)$ : Club</text>
      <text y="18">+ AddMember(member) : void</text>
      <text y="36">+ MemberCount() : int</text>
      <text y="54">+ ToString() : string</text>
    </g>
  </g>

  <!-- ================= 2. EVENT (Middle Left) ================= -->
  <g transform="translate(50, 360)">
    <rect width="290" height="240" class="box" />
    <text x="145" y="24" class="header-title">Event</text>
    <line x1="0" y1="36" x2="290" y2="36" class="divider" />

    <!-- Attributes -->
    <g transform="translate(14, 56)" class="code">
      <text y="0">+ Id : Guid</text>
      <text y="18">+ ClubId : Guid [FK]</text>
      <text y="36">+ Title : string</text>
      <text y="54">+ Date : DateTime</text>
      <text y="72">+ Capacity : int</text>
      <text y="90">+ IsOnline : bool</text>
    </g>
    <line x1="0" y1="160" x2="290" y2="160" class="divider" />

    <!-- Methods -->
    <g transform="translate(14, 180)" class="code">
      <text y="0">+ Create(clubId, title, date, cap)$ : Event</text>
      <text y="18">+ HasCapacity(count) : bool</text>
      <text y="36">+ ToString() : string</text>
    </g>
  </g>

  <!-- ================= 3. MEMBER (Middle Right) ================= -->
  <g transform="translate(660, 360)">
    <rect width="290" height="240" class="box" />
    <text x="145" y="24" class="header-title">Member</text>
    <line x1="0" y1="36" x2="290" y2="36" class="divider" />

    <!-- Attributes -->
    <g transform="translate(14, 56)" class="code">
      <text y="0">+ Id : Guid</text>
      <text y="18">+ Name : string</text>
      <text y="36">+ Email : string</text>
      <text y="54">+ StudentCode : string</text>
      <text y="72">+ JoinedAt : DateTime</text>
      <text y="90">+ Status : MemberStatus</text>
    </g>
    <line x1="0" y1="160" x2="290" y2="160" class="divider" />

    <!-- Methods -->
    <g transform="translate(14, 180)" class="code">
      <text y="0">+ Create(name, email, code)$ : Member</text>
      <text y="18">+ IsActive() : bool</text>
      <text y="36">+ Deactivate() : void</text>
      <text y="54">+ ToString() : string</text>
    </g>
  </g>

  <!-- ================= 4. MEMBER STATUS ENUM ================= -->
  <g transform="translate(770, 660)">
    <rect width="180" height="85" class="box" />
    <text x="90" y="18" class="stereo">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="90" y="34" class="header-title" font-size="13px">MemberStatus</text>
    <line x1="0" y1="42" x2="180" y2="42" class="divider" />
    <g transform="translate(14, 58)" class="code">
      <text y="0">+ Active = 1</text>
      <text y="16">+ Inactive = 2</text>
    </g>
  </g>

  <!-- ================= 5. REGISTRATION (Lower Center) ================= -->
  <g transform="translate(360, 720)">
    <rect width="300" height="240" class="box" />
    <text x="150" y="24" class="header-title">Registration</text>
    <line x1="0" y1="36" x2="300" y2="36" class="divider" />

    <!-- Attributes -->
    <g transform="translate(14, 56)" class="code">
      <text y="0">+ Id : Guid</text>
      <text y="18">+ MemberId : Guid [FK]</text>
      <text y="36">+ EventId : Guid [FK]</text>
      <text y="54">+ RegisteredAt : DateTime</text>
      <text y="72">+ Status : RegistrationStatus</text>
    </g>
    <line x1="0" y1="145" x2="300" y2="145" class="divider" />

    <!-- Methods -->
    <g transform="translate(14, 166)" class="code">
      <text y="0">+ Create(memberId, eventId)$ : Registration</text>
      <text y="18">+ Confirm() : void</text>
      <text y="36">+ Cancel() : void</text>
      <text y="54">+ ToString() : string</text>
    </g>
  </g>

  <!-- ================= 6. REGISTRATION STATUS ENUM ================= -->
  <g transform="translate(160, 1040)">
    <rect width="200" height="100" class="box" />
    <text x="100" y="18" class="stereo">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="100" y="34" class="header-title" font-size="13px">RegistrationStatus</text>
    <line x1="0" y1="42" x2="200" y2="42" class="divider" />
    <g transform="translate(14, 58)" class="code">
      <text y="0">+ Pending = 1</text>
      <text y="16">+ Confirmed = 2</text>
      <text y="32">+ Cancelled = 3</text>
    </g>
  </g>

  <!-- ================= 7. CHECKIN (Bottom Right) ================= -->
  <g transform="translate(500, 1040)">
    <rect width="290" height="180" class="box" />
    <text x="145" y="24" class="header-title">CheckIn</text>
    <line x1="0" y1="36" x2="290" y2="36" class="divider" />

    <!-- Attributes -->
    <g transform="translate(14, 56)" class="code">
      <text y="0">+ Id : Guid</text>
      <text y="18">+ RegistrationId : Guid [FK]</text>
      <text y="36">+ CheckedInAt : DateTime</text>
      <text y="54">+ Method : string</text>
    </g>
    <line x1="0" y1="125" x2="290" y2="125" class="divider" />

    <!-- Methods -->
    <g transform="translate(14, 146)" class="code">
      <text y="0">+ Create(reg, method)$ : CheckIn</text>
      <text y="18">+ ToString() : string</text>
    </g>
  </g>


  <!-- ================= RELATIONSHIP CONNECTORS ================= -->

  <!-- 1. Club -> Event (Composition) -->
  <path d="M 430 270 L 430 310 L 195 310 L 195 360" class="rel-line" marker-start="url(#diamond-filled)" marker-end="url(#arrow)" />
  <rect x="235" y="301" width="160" height="18" class="label-bg" />
  <text x="315" y="314" class="label-text">sở hữu &amp; tổ chức [FK: ClubId]</text>
  <text x="440" y="285" class="multiplicity">1</text>
  <text x="205" y="355" class="multiplicity">*</text>

  <!-- 2. Club -> Member (Aggregation) -->
  <path d="M 590 270 L 590 310 L 805 310 L 805 360" class="rel-line" marker-start="url(#diamond-hollow)" />
  <rect x="635" y="301" width="135" height="18" class="label-bg" />
  <text x="702" y="314" class="label-text">tập hợp thành viên</text>
  <text x="580" y="285" class="multiplicity">1</text>
  <text x="815" y="355" class="multiplicity">*</text>

  <!-- 3. Event -> Registration -->
  <path d="M 195 600 L 195 660 L 435 660 L 435 720" class="rel-line" marker-start="url(#arrow)" />
  <rect x="245" y="651" width="155" height="18" class="label-bg" />
  <text x="322" y="664" class="label-text">nhận đăng ký [FK: EventId]</text>
  <text x="185" y="618" class="multiplicity">1</text>
  <text x="425" y="712" class="multiplicity">*</text>

  <!-- 4. Member -> Registration -->
  <path d="M 805 600 L 805 660 L 585 660 L 585 720" class="rel-line" marker-start="url(#arrow)" />
  <rect x="615" y="651" width="175" height="18" class="label-bg" />
  <text x="702" y="664" class="label-text">sinh viên đăng ký [FK: MemberId]</text>
  <text x="815" y="618" class="multiplicity">1</text>
  <text x="595" y="712" class="multiplicity">*</text>

  <!-- 5. Member ..> MemberStatus -->
  <path d="M 860 600 L 860 660" class="dep-line" marker-end="url(#dep-arrow)" />
  <rect x="870" y="622" width="50" height="16" class="label-bg" />
  <text x="895" y="634" class="label-text">sử dụng</text>

  <!-- 6. Registration ..> RegistrationStatus -->
  <path d="M 435 960 L 435 1000 L 260 1000 L 260 1040" class="dep-line" marker-end="url(#dep-arrow)" />
  <rect x="305" y="991" width="50" height="16" class="label-bg" />
  <text x="330" y="1003" class="label-text">sử dụng</text>

  <!-- 7. Registration -> CheckIn -->
  <path d="M 585 960 L 585 1000 L 645 1000 L 645 1040" class="rel-line" marker-start="url(#arrow)" />
  <rect x="560" y="991" width="165" height="18" class="label-bg" />
  <text x="642" y="1004" class="label-text">điểm danh [FK: RegistrationId]</text>
  <text x="575" y="978" class="multiplicity">1</text>
  <text x="655" y="1032" class="multiplicity">0..1</text>

</svg>
